name: Producción diaria

on:
  push:
    paths: ["data/orden.json"]   # Claude sube una orden para lanzar una producción puntual
  schedule:
    - cron: "0 8 * * *"   # 03:00 en Ecuador (los guiones del día llegan antes)
  workflow_dispatch:
    inputs:
      modo:
        description: "completo = producir y programar · solo_render = solo videos para revisar · canales = ver IDs de Buffer"
        type: choice
        options: [completo, solo_render, canales]
        default: solo_render
      cantidad:
        description: "Cuántos videos producir"
        default: "1"
      horarios:
        description: "Horarios solo para esta ejecución (opcional), ej. 20:00,21:00,22:00"
        default: ""

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: produccion
  cancel-in-progress: false

jobs:
  config:
    runs-on: ubuntu-latest
    outputs:
      modo: ${{ steps.c.outputs.modo }}
      cantidad: ${{ steps.c.outputs.cantidad }}
      horarios: ${{ steps.c.outputs.horarios }}
    steps:
      - uses: actions/checkout@v4
      - id: c
        env:
          EVENTO: ${{ github.event_name }}
          IN_MODO: ${{ inputs.modo }}
          IN_CANT: ${{ inputs.cantidad }}
          IN_HOR: ${{ inputs.horarios }}
          V_CANT: ${{ vars.CANTIDAD }}
          V_HOR: ${{ vars.HORARIOS }}
        run: |
          python3 - <<'PY'
          import json, os
          e = os.environ; ev = e["EVENTO"]
          hor_def = e.get("V_HOR") or "07:00,09:00,11:00,13:00,15:00,17:00,19:00,21:00"
          if ev == "push":
              o = json.load(open("data/orden.json"))
              modo, cant, hor = o.get("modo", "completo"), str(o.get("cantidad", 1)), o.get("horarios") or hor_def
          elif ev == "schedule":
              modo, cant, hor = "completo", e.get("V_CANT") or "8", hor_def
          else:
              modo, cant, hor = e["IN_MODO"], e["IN_CANT"] or "1", e.get("IN_HOR") or hor_def
          with open(e["GITHUB_OUTPUT"], "a") as f:
              f.write(f"modo={modo}\ncantidad={cant}\nhorarios={hor}\n")
          print(modo, cant, hor)
          PY

  canales:
    needs: config
    if: ${{ needs.config.outputs.modo == 'canales' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Listar canales de Buffer
        env:
          PASO: canales
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: python fabrica/publicar.py

  producir:
    needs: config
    if: ${{ needs.config.outputs.modo != 'canales' && needs.config.outputs.modo != 'reprogramar' }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - name: Instalar ffmpeg y cairo
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg libcairo2 fontconfig
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: fabrica/requirements.txt
      - name: Instalar librerías
        run: pip install -r fabrica/requirements.txt
      - name: Recuperar modelos de voz (caché)
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: modelos-voz-v1
      - name: Producir videos
        env:
          ZONA_HORARIA: ${{ vars.ZONA_HORARIA || 'America/Guayaquil' }}
          PASO: producir
          CANTIDAD: ${{ needs.config.outputs.cantidad }}
          HORARIOS: ${{ needs.config.outputs.horarios }}
        run: python fabrica/publicar.py
      - name: Videos para descargar (7 días)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: videos-${{ github.run_number }}
          path: sitio/v/*.mp4
          retention-days: 7
          if-no-files-found: ignore
      - name: Guardar manifiesto
        uses: actions/upload-artifact@v4
        with:
          name: manifiesto
          path: data/manifiesto.json
      - name: Preparar sitio de medios
        if: ${{ needs.config.outputs.modo == 'completo' }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: sitio

  desplegar:
    needs: [config, producir]
    if: ${{ needs.config.outputs.modo == 'completo' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    outputs:
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - id: pages
        uses: actions/deploy-pages@v4

  programar:
    needs: [config, desplegar]
    if: ${{ always() && (needs.desplegar.result == 'success' || needs.config.outputs.modo == 'reprogramar') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - uses: actions/download-artifact@v4
        if: ${{ needs.config.outputs.modo != 'reprogramar' }}
        with:
          name: manifiesto
          path: data
      - name: Manifiesto desde la orden (reprogramar)
        if: ${{ needs.config.outputs.modo == 'reprogramar' }}
        run: python3 -c "import json; json.dump(json.load(open('data/orden.json'))['manifiesto'], open('data/manifiesto.json','w'), ensure_ascii=False)"
      - name: Programar en Buffer
        env:
          PASO: programar
          HORARIOS: ${{ needs.config.outputs.horarios }}
          ZONA_HORARIA: ${{ vars.ZONA_HORARIA || 'America/Guayaquil' }}
          URL_SITIO: ${{ needs.desplegar.outputs.url || format('https://{0}.github.io/{1}/', github.repository_owner, github.event.repository.name) }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          YOUTUBE_CHANNEL_ID: ${{ vars.YOUTUBE_CHANNEL_ID }}
          TIKTOK_CHANNEL_ID: ${{ vars.TIKTOK_CHANNEL_ID }}
          VISIBILIDAD: ${{ vars.VISIBILIDAD || 'public' }}
        run: python fabrica/publicar.py
      - name: Registrar guiones usados
        if: always()
        run: |
          git config user.name "fabrica-bot"
          git config user.email "fabrica-bot@users.noreply.github.com"
          git add data/guiones data/registro.jsonl 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "Programación $(date +%F)" && git pull --rebase -q && git push)
